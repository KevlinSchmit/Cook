<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" fill="none" role="img" aria-labelledby="care-title">
<title id="care-title">An intergenerational group sharing everyday caregiving, drawn as relaxed, connected figures</title>
<defs>
  <filter id="care-grain" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".64" numOctaves="3" seed="19" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
  </filter>
</defs>
<g filter="url(#care-grain)" stroke-linecap="round" stroke-linejoin="round">
<!-- Poses share one low, flowing rhythm. Anatomy is established before garments. -->
<g id="parent-with-infant">
  <!-- One contour links the inclined face, neck, sloping shoulders and body. -->
  <path d="M182 95c16-20 43-19 59-3 11 11 13 26 14 38 1 8 10 13 11 19 0 5-8 7-12 7-3 15-10 25-23 29l-3 20c27 11 45 28 53 53 14 45 8 96-1 146l7 62 18 134H66l20-140 6-72c-5-41 1-87 17-118 13-26 34-40 64-50l7-27c-17-12-24-26-24-43-9-8-8-20 1-23 4-1 8 1 10 4-2-15 3-27 15-36Z" fill="#dfa17f"/>
  <!-- The shirt wraps the bent torso; its opening is a quiet curved neckline. -->
  <path d="M174 211c12 14 35 19 54-6 30 11 48 29 56 58 8 28 7 60 2 87l-42-7c-1-21-4-35-11-46 0 33 10 70 47 102-49 22-112 26-172 8l13-110c-9 12-14 31-17 51l-42-12c3-33 11-62 27-85 17-23 38-33 65-40Z" fill="#5473b0"/>
  <path d="M108 407c48 17 112 17 172-3l7 62 18 134H66l20-140Z" fill="#263b6d"/>
  <path d="M127 266c-11 17-16 37-17 55m132-54c9 16 13 31 13 49m-135 72c30 7 61 7 89 1" stroke="#1f3778" stroke-width="3"/>
  <!-- Close-cropped hair follows the head and turns behind the ear. -->
