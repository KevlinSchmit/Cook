  <path d="M1123 349c6 8 13 10 20 6 14 7 22 20 23 36l-2 32c-16 8-36 9-56 2 1-24 0-48 8-64Z" fill="#e74829"/>
  <path d="M1117 305c-4-14 4-29 18-34 16-4 31 4 34 18 1 5 1 10-1 14-11-2-21-8-26-18-5 11-13 18-25 20Z" fill="#32332c"/>
  <path d="M1144 311c5-1 8 1 10 4m-18 17c5 3 9 3 13 0" stroke="#926445" stroke-width="2"/>
  <path d="M1146 362c12-7 22-15 31-25 5-6 9-7 12-4 2 3-1 8-5 13l-17 22-15 11Z" fill="#d3a27c"/>
