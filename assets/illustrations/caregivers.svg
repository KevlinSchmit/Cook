  <path d="M231 145c2 4 2 7-1 10m-70-16c3-2 6-1 7 2" stroke="#b67658" stroke-width="2"/>
  <path d="M183 208c8 8 20 11 31 6" stroke="#eed9be" stroke-width="3"/>
  <!-- The far forearm supports the newborn's head and upper back. -->
  <path d="M244 335c11 3 24 5 37 7 5 16 1 32-9 42-10 10-23 16-41 15l-23-4c-12-2-20-8-18-13 2-4 8-3 15-1l17 4c11 1 20-3 24-9 5-9 3-20-2-27Z" fill="#dfa17f"/>
  <path d="M271 352c1 11-2 20-8 26m-41 12 14 1" stroke="#bc795c" stroke-width="2.1"/>
