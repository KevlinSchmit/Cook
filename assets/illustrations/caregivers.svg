  <path d="M222 260c9-13 29-11 36 3 4 7 4 13 3 18 5 5 6 8 2 10-3 1-6 1-9 0-8 11-22 9-31 1-10-9-12-23-1-32Z" fill="#efb492"/>
  <path d="M217 271c-2-13 9-25 22-25 12 0 23 8 25 20-13-7-24-3-33 6Z" fill="#876346"/>
  <path d="m243 281 6 2m-13 7c5 4 9 4 13 2" stroke="#b97a59" stroke-width="2"/>
  <!-- Near elbow, wrist, palm and fingertips are one continuous skin contour. -->
  <path d="M75 340c-9 23-8 49 7 63 19 18 61 18 102 5 19-6 37-13 50-24 6-5 9-10 6-13-4-4-10 1-18 6l-18 9c12-12 14-18 10-20-5-3-13 6-21 13-12 10-27 15-48 18-18 2-31 0-36-7-6-9-3-23 2-40Z" fill="#dfa17f"/>
  <path d="M86 351c-4 19-2 32 5 40m101 0 23-11m-23 18 19-8" stroke="#bc795c" stroke-width="2.2"/>
  <path d="M68 334c12 3 28 8 43 10l-3 12c-14-1-29-5-43-9Z" fill="#eee4cc"/>
  <path d="M238 329c12 3 26 4 41 4l2 12c-16 2-29 0-43-3Z" fill="#eee4cc"/>
</g>

