</g>
<!-- Supporting fingers lie in front of the bowl, with a clear thumb and palm. -->
<path d="M378 886c-29-12-42-24-61-41l-18-20c-12-9-24 2-14 12l14 18-42-20c-15-8-25 5-10 14l42 25-63-20c-15-4-21 10-6 17l64 28-54-11c-18-4-23 10-6 17l74 29c23 9 47 6 70-7Z" fill="#efa786"/>
