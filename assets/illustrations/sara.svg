<path d="M434 256c9-19 22-26 35-27" stroke="#4e4d40" stroke-width="3" stroke-linecap="round"/>
<path d="M438 317c6-7 12-7 18-2" stroke="#191e21" stroke-width="3.5" stroke-linecap="round"/>
<path d="M439 331c6 5 11 6 16 1m-2 1 4 4" stroke="#191e21" stroke-width="3.5" stroke-linecap="round"/>
