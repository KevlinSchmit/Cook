<path d="m236 562 33-49m303-22 34 72m-342 55-14 110" stroke="#b7af94" stroke-width="3" stroke-linecap="round"/>
<!-- Vermilion apron straps and an angular, deliberately oversized apron. -->
<path d="m348 446 24-3 20 125 148-10 1-110 24 11 3 124 27 18 37 668-435 1 37-663 31-19Z" fill="#e94728"/>
<path d="m379 468 14 91-12 1-12-88Zm175 10-1 93-10 6 1-104Z" fill="#f27a52"/>
