<path d="m477 481 34 37 29-28" stroke="#d6c8a5" stroke-width="3" stroke-linecap="round"/>
<!-- Food is the composition's large central mass, like the source posters. -->
<g transform="translate(104 253) scale(.89)">

<!-- Dark interior is deliberately visible between the cut-paper ingredients. -->
<path d="M92 431C112 345 507 318 637 410 672 438 627 499 576 510L157 513Z" fill="#191f22"/>
<!-- Broad leaf with a pale, slightly bent center vein. -->
<path d="M183 457C128 442 81 408 93 371 51 343 67 302 100 301 79 258 104 228 132 235 140 190 190 184 205 216 242 196 274 221 257 257 299 259 305 299 276 318 314 350 299 392 265 392 279 437 233 456 183 457Z" fill="#20764e"/>
