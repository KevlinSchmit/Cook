<path d="m146 565 22-37 76 38-17 45Z" fill="#f6ecd4"/>
<path d="m155 565 76 34-4 12-81-43Z" fill="#d8cfb4"/>
<path d="m162 547 71 36" stroke="#e84a2c" stroke-width="5"/>
