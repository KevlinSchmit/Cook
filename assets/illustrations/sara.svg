<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" fill="none" role="img" aria-labelledby="title"><title id="title">Sara, an editorial vector portrait with expressive hands and a generous blue cooking bowl</title>
<defs>
  <filter id="print" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" stitchTiles="stitch" seed="19" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale=".8" xChannelSelector="R" yChannelSelector="G" result="paint"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="faint"><feFuncA type="linear" slope=".21"/></feComponentTransfer>
    <feComposite in="faint" in2="paint" operator="in" result="ink"/>
    <feBlend in="paint" in2="ink" mode="soft-light"/>
  </filter>
  <pattern id="scumble" width="71" height="67" patternUnits="userSpaceOnUse">
    <path d="m8 12 3-1m25 28 2-2m18 20 3 1M15 54l2-1m44-46 1 2M32 8l1 1M6 35h2m46-12 2 1" stroke="#f6efda" stroke-width="1.3" opacity=".10"/>
    <path d="m22 20 2 1m42 25 1-2M42 58l2 1M25 63h1" stroke="#17211e" stroke-width="1" opacity=".07"/>
  </pattern>
</defs>
<g filter="url(#print)">

<g transform="translate(0 -65)">
<!-- Her posture is an enclosing gesture, with the food as its center of gravity. -->
<!-- Ink underpainting creates one strong adult silhouette. -->
<path d="M316 460c93-29 215-40 281 12l69 102-66 92 15 604-480-1 50-651-39-28 69-101Z" fill="#191e21"/>
