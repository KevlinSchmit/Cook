<path d="M466 97c18-7 35 2 32 17m57 34c32 3 51 20 57 47" stroke="#4a4b40" stroke-width="4" stroke-linecap="round"/>
<!-- Her neck inclines naturally toward the bowl. -->
<path d="m480 379-10 65-24 10c8 34 34 61 70 69l27-73-30-34 8-60Z" fill="#eea080"/>
<path d="m479 406-6 32 32 35-4-45Z" fill="#d96a52"/>
