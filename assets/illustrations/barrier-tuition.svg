<path d="M215 156c38-3 58 38 44 67-12 29-57 31-76 6-19-29-6-69 32-73Z" fill="#bd8833"/>
<path d="M211 154c36-1 54 36 42 63-12 28-51 31-68 7-20-26-10-67 26-70Z" fill="#e5b739"/>
<path d="M213 165c27-2 43 28 33 50-9 22-40 25-55 6-15-22-8-54 22-56Z" stroke="#f7dfa1" stroke-width="3"/>
<path d="m221 171-8 47m-10-36c10-9 26-1 20 7-5 7-23 2-22 12 2 9 17 14 25 5" stroke="#aa7729" stroke-width="4" stroke-linecap="round"/>
</g></svg>
