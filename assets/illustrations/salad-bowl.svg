<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" fill="none" role="img" aria-labelledby="title"><title id="title">An expressive blue bowl of cut-paper vegetables, inspired by vintage culinary editorial art</title>
<defs>
  <filter id="print" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" stitchTiles="stitch" seed="19" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale=".8" xChannelSelector="R" yChannelSelector="G" result="paint"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="faint"><feFuncA type="linear" slope=".21"/></feComponentTransfer>
    <feComposite in="faint" in2="paint" operator="in" result="ink"/>
    <feBlend in="paint" in2="ink" mode="soft-light"/>
  </filter>
  <pattern id="scumble" width="71" height="67" patternUnits="userSpaceOnUse">
    <path d="m8 12 3-1m25 28 2-2m18 20 3 1M15 54l2-1m44-46 1 2M32 8l1 1M6 35h2m46-12 2 1" stroke="#f6efda" stroke-width="1.3" opacity=".10"/>
    <path d="m22 20 2 1m42 25 1-2M42 58l2 1M25 63h1" stroke="#17211e" stroke-width="1" opacity=".07"/>
  </pattern>
</defs>
<g filter="url(#print)">

<!-- Dark interior is deliberately visible between the cut-paper ingredients. -->
<path d="M92 431C112 345 507 318 637 410 672 438 627 499 576 510L157 513Z" fill="#191f22"/>
<!-- Broad leaf with a pale, slightly bent center vein. -->
<path d="M183 457C128 442 81 408 93 371 51 343 67 302 100 301 79 258 104 228 132 235 140 190 190 184 205 216 242 196 274 221 257 257 299 259 305 299 276 318 314 350 299 392 265 392 279 437 233 456 183 457Z" fill="#20764e"/>
<path d="M193 437c-40-56-50-134-41-205" stroke="#f4eacb" stroke-width="9" stroke-linecap="round"/>
<path d="M182 392c-19-10-39-25-55-46m43-14c21-18 40-34 57-63" stroke="#91ab65" stroke-width="5" stroke-linecap="round"/>
<!-- Long diagonal carrot, with intentional notches and gaps. -->
<path d="m359 463 77-229 79 23-126 225Z" fill="#ee5429"/>
<path d="m435 239-12-72 30 30 12-73 25 67 52-45-17 61 43-7-58 59Z" fill="#819238"/>
<path d="m448 281 33 9m-45 24 29 11m-41 21 24 11m-37 20 22 10m-35 18 18 8" stroke="#191f22" stroke-width="5" stroke-linecap="round"/>
<path d="m464 267 11 5m-40 82 10 4" stroke="#f7e7c6" stroke-width="10" stroke-linecap="round"/>
<!-- Mushroom cap and stem have an asymmetric, weighted silhouette. -->
<path d="M243 303c-10-19-10-34 2-48 20-22 62-18 79 9 7 12 10 22 4 31Z" fill="#e7bc36"/>
<path d="M244 300c13-24 72-25 84-5-14 20-62 31-84 5Z" fill="#f3e7c9"/>
<path d="m280 304-7 45c-3 12 15 15 23 4 3-5 0-29-1-49Z" fill="#eee4c9"/>
<path d="m269 296-6 12m20-14-3 13m18-15 3 10m11-13 5 7" stroke="#d65436" stroke-width="3" stroke-linecap="round"/>
<!-- Tomato nestles into the dark negative spaces. -->
<path d="M274 424c-9-33 10-60 43-64 28-3 58 28 48 56-9 31-72 40-91 8Z" fill="#ee4626"/>
<path d="m307 369-20-20 29 8 17-23 1 25 28 8-29 6-13 25-6-23Z" fill="#238054"/>
<path d="m291 394-2 11" stroke="#f7ecd0" stroke-width="7" stroke-linecap="round"/>
<!-- Pale onion rings are irregular, never concentric ellipses. -->
<path d="M454 469c-41-39-18-86 42-132 36 50 99 82 67 126-26 27-65 25-109 6Z" fill="#d5a0c2"/>
<path d="M492 349c-62 44-63 86-23 113m23-101c-47 41-44 76-17 94m17-81c-31 34-25 59-11 73m11-58c-15 25-12 39-6 49m15-86c68 47 80 82 28 110m-22-95c49 39 59 68 22 88m-16-71c34 30 40 52 13 65m-8-49c20 24 21 37 5 45" stroke="#f7ebd6" stroke-width="6" stroke-linecap="round"/>
<!-- A few scattered salt grains and onion crescents. -->
<path d="m337 301 4 9m-12 27 3 6m-64 21 3 7m108-42 4 8m14 104 3 7m-146-55 4 7m130-81 5 4" stroke="#f6ecd5" stroke-width="6" stroke-linecap="round"/>
<path d="M225 394c-16-22-40-11-30 12 8 19 27 9 30-12Zm158-90c-20-9-28 12-14 19 14 7 24-7 14-19Z" stroke="#f4ebd1" stroke-width="6"/>
