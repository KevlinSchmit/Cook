<path d="M87 447c36 28 88 48 152 57 137 19 290-3 410-66-3 131-85 222-237 238C244 694 121 621 87 447Z" fill="#338aa4"/>
<path d="M87 447c129 88 383 82 562-9l-5 23C461 553 213 553 92 472Z" fill="#181e21"/>
