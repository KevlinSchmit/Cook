    <feComponentTransfer in="mono" result="faint"><feFuncA type="linear" slope=".21"/></feComponentTransfer>
    <feComposite in="faint" in2="paint" operator="in" result="ink"/>
    <feBlend in="paint" in2="ink" mode="soft-light"/>
  </filter>
