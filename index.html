<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slide deck</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; background: #101827; }
    .slide { width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; background: #1565c0; }
  </style>
</head>
<body>
  <main class="slide" aria-label="Slide 1: blue background"></main>
</body>
</html>
